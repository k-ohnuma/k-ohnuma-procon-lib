name: Publish to crates.io
on:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v19
      - uses: DeterminateSystems/magic-nix-cache-action@v13
      - name: format check
        run: nix develop -c cargo fmt --all -- --check
      - name: test
        run: nix develop -c cargo nextest run
  publish:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: DeterminateSystems/nix-installer-action@v19
      - uses: DeterminateSystems/magic-nix-cache-action@v13
      - name: Detect version change
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          curr="$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -n1)"
          prev="$(git show HEAD~1:Cargo.toml 2>/dev/null | sed -n 's/^version *= *"\(.*\)"/\1/p' | head -n1 || true)"

          echo "curr=$curr"
          echo "prev=$prev"

          echo "curr=$curr" >> "$GITHUB_OUTPUT"
          echo "prev=$prev" >> "$GITHUB_OUTPUT"

          if [[ -n "$prev" && "$curr" == "$prev" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish
        if: steps.ver.outputs.changed == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: nix develop -c cargo publish --locked
